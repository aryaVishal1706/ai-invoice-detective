name: Deploy — Full Stack (Infra + Code)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION:         ap-south-1
  LAMBDA_FUNCTION:    ai-invoice-detective-api
  ML_LAMBDA_FUNCTION: ai-invoice-detective-ml

jobs:
  # ── Step 1: Terraform + initial Lambda deploy ─────────────────────────────
  terraform:
    name: 1. Terraform — AWS Infrastructure
    runs-on: ubuntu-latest

    outputs:
      lambda_bucket:   ${{ steps.outputs.outputs.lambda_bucket }}
      model_bucket:    ${{ steps.outputs.outputs.model_bucket }}
      frontend_bucket: ${{ steps.outputs.outputs.frontend_bucket }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Build lambda.zip — code only (no heavy deps)
      - name: Build lambda.zip (API code only)
        run: |
          mkdir -p package
          cp -r api core models main.py lambda_handler.py package/
          cd package && zip -r ../lambda.zip . -x "*.pyc" -x "*/__pycache__/*" && cd ..
          echo "lambda.zip: $(du -sh lambda.zip | cut -f1)"

      # Build ml_lambda.zip — ML code + scikit-learn deps
      - name: Build ml_lambda.zip (ML code + dependencies)
        run: |
          mkdir -p ml_package
          pip install scikit-learn pandas numpy -t ml_package/ --quiet
          cp ml_lambda_handler.py ml_package/
          cd ml_package && zip -r ../ml_lambda.zip . -x "*.pyc" -x "*/__pycache__/*" && cd ..
          echo "ml_lambda.zip: $(du -sh ml_lambda.zip | cut -f1)"

      # Upload zip to S3 (bucket may not exist yet — terraform creates it first)
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      # Apply only infra except Lambda first (S3, IAM, DynamoDB, API GW)
      - name: Terraform Apply — infra only
        run: |
          terraform apply -auto-approve \
            -var="groq_api_key=${{ secrets.GROQ_API_KEY }}" \
            -target=aws_s3_bucket.lambda_bucket \
            -target=aws_s3_bucket.model_bucket \
            -target=aws_s3_bucket.frontend_bucket \
            -target=aws_s3_bucket_website_configuration.frontend \
            -target=aws_s3_bucket_public_access_block.frontend \
            -target=aws_s3_bucket_policy.frontend_public \
            -target=aws_dynamodb_table.reports \
            -target=aws_iam_role.lambda_role \
            -target=aws_iam_role_policy.lambda_policy
        working-directory: terraform

      # Train model if not present, then upload assets to S3
      - name: Upload zips and model to S3
        run: |
          BUCKET=$(cd terraform && terraform output -raw lambda_bucket_name)
          MODEL_BUCKET=$(cd terraform && terraform output -raw model_bucket_name)
          aws s3 cp lambda.zip    s3://$BUCKET/lambda.zip
          aws s3 cp ml_lambda.zip s3://$BUCKET/ml_lambda.zip

          # Train model if pkl not in repo
          if [ ! -f models/trained/isolation_forest.pkl ]; then
            pip install scikit-learn pandas numpy -q
            mkdir -p models/trained
            PYTHONPATH=. python3 -c "from core.anomaly.detector import train_model; train_model()"
          fi

          # Generate vendor stats if not present
          if [ ! -f data/raw/vendor_stats.json ]; then
            pip install scikit-learn pandas numpy -q
            PYTHONPATH=. python3 scripts/export_vendor_stats.py
          fi

          aws s3 cp models/trained/isolation_forest.pkl s3://$MODEL_BUCKET/isolation_forest.pkl
          aws s3 cp data/raw/vendor_stats.json          s3://$MODEL_BUCKET/vendor_stats.json

      # Now apply everything including Lambda (zip is in S3)
      - name: Terraform Apply — full
        run: terraform apply -auto-approve -var="groq_api_key=${{ secrets.GROQ_API_KEY }}"
        working-directory: terraform

      - name: Get bucket names
        id: outputs
        run: |
          cd terraform
          echo "lambda_bucket=$(terraform output -raw lambda_bucket_name)"     >> $GITHUB_OUTPUT
          echo "model_bucket=$(terraform output -raw model_bucket_name)"       >> $GITHUB_OUTPUT
          echo "frontend_bucket=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT

  # ── Step 2: Update Lambda with latest code ────────────────────────────────
  deploy-backend:
    name: 2. Update Lambda Code
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and deploy both Lambdas
        run: |
          # API Lambda (code only — tiny)
          mkdir -p package
          cp -r api core models main.py lambda_handler.py package/
          cd package && zip -r ../lambda.zip . -x "*.pyc" -x "*/__pycache__/*" && cd ..

          # ML Lambda (scikit-learn + ml code)
          mkdir -p ml_package
          pip install scikit-learn pandas numpy -t ml_package/ --quiet
          cp ml_lambda_handler.py ml_package/
          cd ml_package && zip -r ../ml_lambda.zip . -x "*.pyc" -x "*/__pycache__/*" && cd ..

          BUCKET=${{ needs.terraform.outputs.lambda_bucket }}
          aws s3 cp lambda.zip    s3://$BUCKET/lambda.zip
          aws s3 cp ml_lambda.zip s3://$BUCKET/ml_lambda.zip

          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION }} \
            --s3-bucket $BUCKET --s3-key lambda.zip

          aws lambda update-function-code \
            --function-name ${{ env.ML_LAMBDA_FUNCTION }} \
            --s3-bucket $BUCKET --s3-key ml_lambda.zip

      - name: Upload ML model
        run: |
          if [ -f models/trained/isolation_forest.pkl ]; then
            aws s3 cp models/trained/isolation_forest.pkl \
              s3://${{ needs.terraform.outputs.model_bucket }}/isolation_forest.pkl
          fi

  # ── Step 3: Deploy Frontend → S3 ─────────────────────────────────────────
  deploy-frontend:
    name: 3. Deploy Frontend → S3
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and deploy frontend
        run: |
          cd frontend/frontend
          npm ci
          npm run build
          aws s3 sync dist/ s3://${{ needs.terraform.outputs.frontend_bucket }} --delete
